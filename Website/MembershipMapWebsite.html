<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Better Wusa_membership Website</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="leafletMap.css">

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>

    <!-- Your JavaScript -->
    <script src="leafletMapScript.js" defer></script>
</head>

<body>
    <h1> The Better Wusa_Membership Website </h1>
    <p id="map-status" role="status">Loading offer locations...</p>
    <button id="show-offers" type="button" disabled>Show all offer pins</button>
    <div id="map" data-offers-url="../Scraper/offers.json"></div>

    <section class="In-Person-Section">
        <h2>In-person and online/in-person offers</h2>
        <p>Numbers on pins show how many offers share that location.</p>
        <ul id="offer-locations"></ul>
    </section>
</body>

</html>
