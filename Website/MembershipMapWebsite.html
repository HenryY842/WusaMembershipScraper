<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#171815">
    <title>Offers</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="leafletMap.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="leafletMapScript.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#offers-panel">Skip to offers</a>
    <div class="website-header">
        <head> Website Name </head>
    </div>
    <main class="page-shell" aria-label="Student offers">
        <div class="category-tabs" role="tablist" aria-label="Offer category">
            <button id="tab-ONLINE" class="category-tab" role="tab" aria-selected="false" aria-controls="offers-panel" tabindex="-1" data-category="ONLINE">Online <span class="tab-count" data-count="ONLINE">—</span></button>
            <button id="tab-IN_PERSON" class="category-tab" role="tab" aria-selected="true" aria-controls="offers-panel" tabindex="0" data-category="IN_PERSON">In person <span class="tab-count" data-count="IN_PERSON">—</span></button>
            <button id="tab-BOTH" class="category-tab" role="tab" aria-selected="false" aria-controls="offers-panel" tabindex="-1" data-category="BOTH">Both <span class="tab-count" data-count="BOTH">—</span></button>
        </div>
        <div class="map-frame">
            <div class="map-canvas">
                <div id="map" data-offers-url="../Scraper/offers.json" aria-label="Map of offer locations"></div>
                <button id="show-offers" class="map-reset" type="button" disabled>Show all pins</button>
            </div>
            <p id="map-status" role="status" aria-live="polite">Loading offers…</p>
        </div>
        <section id="offers-panel" class="offers-section" role="tabpanel" aria-labelledby="tab-IN_PERSON" tabindex="0">
            <ul id="offer-locations" class="offer-list" aria-label="Offers and addresses"></ul>
            <p id="offers-empty" class="empty-state" hidden>No offers in this category.</p>
        </section>
    </main>
</body>
</html>
